name: NRL odds

on:
  schedule:
    # GitHub cron is UTC. AEST is UTC+10, so subtract 10 from the AEST hour.
    # Thu-Sun (NRL match days), roughly midday to 9pm AEST.
    - cron: '0 2,4,6,8,10,11 * * 4,5,6,0'
  workflow_dispatch:        # manual "Run workflow" button, works from GitHub mobile

permissions:
  contents: write           # required so the job can push nrl.json back

concurrency:
  group: nrl-odds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Fetch odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_odds.py

      - name: Commit if changed
        run: |
          git config user.name  "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add nrl.json
          if git diff --staged --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "odds $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
