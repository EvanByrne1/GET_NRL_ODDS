name: NRL odds

on:
  workflow_dispatch:
    inputs:
      regions:
        description: 'Books to pull'
        type: choice
        default: 'au,eu'
        options:
          - 'au,eu'      # + Pinnacle: sharp, low-margin, covers spreads & totals
          - 'au'         # cheaper, AU books + Betfair only
      props:
        description: 'Include anytime tryscorer'
        type: boolean
        default: true
      props_window:
        description: 'Props only for games within N hours'
        default: '8'

permissions:
  contents: write

concurrency:
  group: nrl-odds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests

      - name: Fetch odds
        env:
          ODDS_API_KEY:  ${{ secrets.ODDS_API_KEY }}
          REGIONS:       ${{ inputs.regions }}
          FETCH_PROPS:   ${{ inputs.props }}
          PROPS_WINDOW:  ${{ inputs.props_window }}
        run: python fetch_odds.py

      - name: Commit if changed
        run: |
          git config user.name  "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add nrl.json
          if git diff --staged --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "odds $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
